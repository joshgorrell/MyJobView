name: Employee mention recognition
on:
  pull_request:
    paths:
      - 'src/lib/flow/mentionCandidates.ts'
      - 'src/components/Flow/CustomerConversations.tsx'
      - 'src/components/Flow/coworkerConversations.ts'
      - 'tests/flow/mention-candidates.mjs'
      - '.github/workflows/mention-recognition.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: node tests/flow/mention-candidates.mjs
      # The repository currently has unrelated pre-existing type errors. Report them without blocking build verification.
      - run: npm run typecheck
        continue-on-error: true
      - run: npm run build
