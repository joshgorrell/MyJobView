name: Labor dashboard review
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/components/Production/LaborDashboard/**'
      - 'src/components/Production/TechStats.tsx'
      - 'src/components/Admin/TimeClockManagement.tsx'
      - 'src/components/Production/TechProductionStats.tsx'
      - 'src/lib/techProduction*.ts'
      - 'src/lib/laborDashboard.ts'
      - 'src/components/Admin/*CSVImport.tsx'
      - 'supabase/functions/labor-dashboard-ingest/**'
      - 'supabase/migrations/*labor*.sql'
      - 'supabase/migrations/*tech_production*.sql'
      - 'tests/labor-dashboard/**'
      - '.github/workflows/labor-dashboard-review.yml'
permissions:
  contents: read
jobs:
  labor-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:labor-dashboard
      - run: node tests/labor-dashboard/tech-stats-access-contract.mjs
      - run: node tests/navigation/workspace-routes.mjs
      - run: node tests/workspace-consolidation/runtime.mjs
      - run: npm run build
      # Use the validated headless browser for local fixture checks.
      - run: npx --yes playwright@1.56.1 install --with-deps chromium --only-shell
      - run: CHROMIUM_EXECUTABLE_PATH="$HOME/.cache/ms-playwright/chromium_headless_shell-1194/chrome-linux/headless_shell" node tests/labor-dashboard/production-browser.mjs
