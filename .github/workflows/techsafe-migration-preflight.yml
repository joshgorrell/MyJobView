name: Techsafe migration preflight

on:
  pull_request:
    paths:
      - '.github/workflows/techsafe-migration-preflight.yml'
      - 'package.json'
      - 'tests/techsafe/**'
      - 'supabase/migrations/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Techsafe migration inventory and default-off observer
        run: npm run test:techsafe:preflight
