name: Proposal source review
on:
  pull_request:
    paths:
      - 'src/components/Proposals/CreateProposalModal.tsx'
      - 'src/components/Proposals/ProposalsView.tsx'
      - 'tests/proposals/source-draft-browser.mjs'
      - '.github/workflows/proposal-source-review.yml'
jobs:
  source-draft-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node tests/proposals/source-draft-browser.mjs
