name: Critical main workflow monitor
on:
  workflow_run:
    workflows: ['*']
    types: [completed]
    branches: [main]
permissions:
  contents: read
  issues: write
concurrency:
  group: critical-monitor-${{ github.event.workflow_run.id }}
  cancel-in-progress: false
jobs:
  report:
    if: github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.name != 'Critical main workflow monitor'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report failed main workflow
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          title="[Main workflow failure] Run $RUN_ID"
          existing="$(gh api --paginate "repos/$GH_REPO/issues?state=all&per_page=100" --jq '.[] | select(.pull_request == null) | .title' | grep -Fx "$title" || true)"
          if [[ -n "$existing" ]]; then exit 0; fi
          gh issue create --repo "$GH_REPO" --title "$title" --body "A push-triggered main workflow failed. Review https://github.com/$GH_REPO/actions/runs/$RUN_ID to determine deployment impact and recovery. This is a monitoring signal, not proof of a production outage."
