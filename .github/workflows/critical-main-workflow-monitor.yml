name: Critical main workflow monitor
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  actions: read
  issues: write
concurrency:
  group: critical-main-workflow-monitor
  cancel-in-progress: false
jobs:
  report:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check recent failed main workflows
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          since="$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%SZ)"
          runs="$(gh api --paginate --method GET "repos/$GH_REPO/actions/runs" -f branch=main -f event=push -f status=failure -f "created=>=$since" -F per_page=100 --jq '.workflow_runs[] | .id')"
          # Recover only monitor-created issues whose exact run has succeeded.
          open="$(gh api --paginate --method GET "repos/$GH_REPO/issues" -f state=open -F per_page=100 --jq '.[] | select(.pull_request == null and .user.login == "github-actions[bot]") | [.number,.title] | @tsv')"
          while IFS=$'\t' read -r number title; do
            [[ "$number" =~ ^[0-9]+$ ]] || continue
            if [[ "$title" =~ ^\[Main\ workflow\ failure\]\ Run\ ([0-9]+)$ ]]; then
              id="${BASH_REMATCH[1]}"
              conclusion="$(gh api "repos/$GH_REPO/actions/runs/$id" --jq '.conclusion')"
              if [[ "$conclusion" == success ]]; then
                gh issue close "$number" --repo "$GH_REPO" --comment "The same workflow run now reports success. This confirms workflow recovery, not production health."
              fi
            fi
          done <<< "$open"
          [[ -n "$runs" ]] || exit 0
          # Fetch once, not once per failure. Include closed issues to avoid duplicates.
          matches="$(gh api --paginate --method GET "repos/$GH_REPO/issues" -f state=all -F per_page=100 --jq '.[] | select(.pull_request == null) | .title')"
          while IFS= read -r id; do
            [[ -n "$id" ]] || continue
            [[ "$id" =~ ^[0-9]+$ ]]
            title="[Main workflow failure] Run $id"
            if grep -Fxq "$title" <<< "$matches"; then continue; fi
            # Recheck current conclusion in case the run recovered during polling.
            conclusion="$(gh api "repos/$GH_REPO/actions/runs/$id" --jq '.conclusion')"
            [[ "$conclusion" == failure ]] || continue
            gh issue create --repo "$GH_REPO" --title "$title" --body "A push-triggered main workflow failed. Review https://github.com/$GH_REPO/actions/runs/$id to determine deployment impact and recovery. This signal is not proof of a production outage."
            matches="$(printf '%s\n%s' "$matches" "$title")"
          done <<< "$runs"
