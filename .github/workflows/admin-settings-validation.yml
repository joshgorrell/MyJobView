name: Admin settings validation
on:
  pull_request:
    paths:
      - 'src/components/Admin/CompanySettings.tsx'
      - 'src/components/Admin/Settings.tsx'
      - '.github/workflows/admin-settings-validation.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
