name: Work order task scope checks
on:
  pull_request:
    paths:
      - 'src/components/Production/**'
      - 'src/components/Projects/**'
      - 'src/components/Proposals/**'
      - 'src/components/Sales/**'
      - 'src/components/Shared/TaskGroups.tsx'
      - 'src/lib/jobOffline.ts'
      - 'src/lib/useJobDraft.ts'
      - 'supabase/migrations/*handoff*'
      - 'src/components/Shared/QuickActionModal.tsx'
      - 'tests/work-orders/**'
      - 'tests/program-access/**'
      - 'src/components/Admin/WorkOrderSettings.tsx'
      - 'src/lib/workOrderOptions.ts'
      - 'supabase/migrations/*work_order_configuration*'
      - 'package*.json'
      - '.github/workflows/work-order-scope-review.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  task-scope:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:handoff
      - run: npm run test:program-access
      - run: npx eslint src/components/Shared/QuickActionModal.tsx
      - run: npx playwright install --with-deps chromium
      - run: node tests/work-orders/browser.mjs
