name: Work order task scope checks
on:
  pull_request:
    paths:
      - 'src/components/Production/**'
      - 'src/components/Projects/**'
      - 'src/components/Proposals/**'
      - 'src/components/Sales/**'
      - 'src/components/Shared/TaskGroups.tsx'
      - 'src/lib/jobOffline.ts'
      - 'src/lib/useJobDraft.ts'
      - 'supabase/migrations/*handoff*'
      - 'src/components/Shared/QuickActionModal.tsx'
      - 'tests/work-orders/**'
      - 'tests/program-access/**'
      - 'src/components/Admin/WorkOrderSettings.tsx'
      - 'src/lib/workOrderOptions.ts'
      - 'src/lib/workOrderScheduling.ts'
      - 'src/components/Shared/Calendar/**'
      - 'src/components/Shared/SchedulingCalendar.tsx'
      - 'src/components/Appointments/**'
      - 'src/components/Dispatch/**'
      - 'src/components/Flow/Flow.tsx'
      - 'src/lib/workspaceRoutes.ts'
      - 'tests/navigation/workspace-routes.mjs'
      - 'src/components/Service/ServiceRequestForm.tsx'
      - 'tests/service-requests/**'
      - 'tests/calendar/**'
      - 'supabase/migrations/*work_order_configuration*'
      - 'supabase/migrations/*complete_work_order_scheduling*'
      - 'package*.json'
      - '.github/workflows/work-order-scope-review.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  task-scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:work-orders
      - run: npm run test:service-requests
      - run: npm run test:handoff
      - run: npm run test:program-access
      - run: npx eslint src/components/Shared/QuickActionModal.tsx
      # Ubuntu 24.04 provides Chromium system libraries; avoid unbounded apt downloads.
      - run: npm install --no-save --package-lock=false playwright@1.55.1
      - name: Install and verify headless Chromium
        timeout-minutes: 5
        run: |
          npx playwright install --only-shell chromium
          node --input-type=module -e 'import { chromium } from "playwright"; const browser = await chromium.launch({headless: true}); await browser.close();'
      - run: node tests/work-orders/browser.mjs
      - run: npm run test:work-orders:scheduling:browser
      - run: node tests/work-orders/complete-scheduling-browser.mjs
      - run: node tests/service-requests/intake-browser.mjs
      - run: node tests/service-requests/flow-link-browser.mjs
      - run: node tests/navigation/workspace-routes.mjs
