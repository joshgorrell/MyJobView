name: Assist Windows preflight
on:
  pull_request:
    paths:
      - 'services/assist/windows-agent-download-check.ps1'
      - 'tests/assist/windows-agent-download-check.mjs'
      - 'tests/assist/windows-preflight-smoke.ps1'
      - '.github/workflows/assist-windows-preflight.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-powershell:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Parse and exercise safe failure cases in Windows PowerShell
        shell: powershell
        run: .\\tests\\assist\\windows-preflight-smoke.ps1
      - name: Parse and exercise safe failure cases in PowerShell 7
        shell: pwsh
        run: ./tests/assist/windows-preflight-smoke.ps1
