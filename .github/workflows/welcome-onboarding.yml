name: Employee welcome onboarding
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/App.tsx'
      - 'src/components/Auth/EmployeeWelcomeOnboarding.tsx'
      - 'src/components/Settings/NotificationPreferenceFields.tsx'
      - 'src/components/Settings/UserPreferences.tsx'
      - 'src/lib/notificationPreferences.ts'
      - 'src/lib/pushNotifications.ts'
      - 'supabase/migrations/*employee_welcome_onboarding.sql'
      - 'tests/welcome-onboarding/**'
      - '.github/workflows/welcome-onboarding.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:welcome-onboarding
      - run: npm run test:welcome-onboarding:browser
        env:
          VITE_SUPABASE_URL: https://fixture.supabase.co
          VITE_SUPABASE_ANON_KEY: fixture-key
