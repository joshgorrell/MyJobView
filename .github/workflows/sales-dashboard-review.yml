name: Sales Dashboard review
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/components/SalesDashboard/**'
      - 'src/hooks/useSalesDashboard*.ts'
      - 'src/lib/salesDashboard*.ts'
      - 'src/lib/companySalesDashboard.ts'
      - 'src/lib/permissionCatalog.ts'
      - 'src/components/Layout/QuickAccessNavigation.tsx'
      - 'tests/sales-dashboard/**'
      - '.github/workflows/sales-dashboard-review.yml'
permissions:
  contents: read
jobs:
  sales-dashboard-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: node tests/sales-dashboard/records.mjs
      - run: node tests/sales-dashboard/pagination.mjs
      - run: node tests/sales-dashboard/rep-default.mjs
      - run: node tests/sales-dashboard/company.mjs
      - run: node tests/sales-dashboard/company-queries.mjs
      - run: node tests/sales-dashboard/runtime.mjs
      - run: npm run build
      - run: npm install --no-save --package-lock=false playwright@1.55.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/sales-dashboard/browser.mjs
