name: AI assistant permission checks
on:
  pull_request:
    paths:
      - 'supabase/functions/ai-assistant/**'
      - 'src/components/AIAssistant/**'
      - 'src/components/Sales/SalesDashboard.tsx'
      - 'src/components/SalesDashboard/SalesDashboardPage.tsx'
      - 'src/App.tsx'
      - 'tests/ai-assistant/**'
      - 'package*.json'
      - '.github/workflows/ai-assistant-review.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  permissions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:ai-assistant
