name: Techsafe source safeguards
on:
  pull_request:
    paths:
      - 'supabase/migrations/*techsafe*'
      - 'tests/techsafe/**'
      - '.github/workflows/techsafe-source.yml'
      - 'src/components/Products/ProductTechsafeExclusion.tsx'
      - 'src/components/Products/ProductDetailModal.tsx'
      - 'package.json'
      - 'package-lock.json'
permissions:
  contents: read
jobs:
  exclusions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node tests/techsafe/product-exclusions.mjs
      - run: node tests/techsafe/removal-provenance.mjs
      - run: node tests/techsafe/retry-safe-application.mjs
      - run: node tests/techsafe/workflow-isolation.mjs
      - run: npx playwright install --with-deps chromium
      - run: node tests/techsafe/product-exclusions-browser.mjs
