name: Monthly sales credit review
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/components/SalesDashboard/**'
      - 'src/components/Contacts/ContactDetail.tsx'
      - 'src/components/Contacts/ContactPaymentsCredits.tsx'
      - 'src/lib/salesPerformance.ts'
      - 'supabase/migrations/*monthly_sales_credit*'
      - 'tests/sales-credit/**'
      - '.github/workflows/sales-credit-review.yml'
permissions:
  contents: read
jobs:
  credit-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: node tests/sales-credit/database.mjs
      - run: node tests/sales-credit/response.mjs
      - run: node tests/sales-dashboard/records.mjs && node tests/sales-dashboard/company.mjs && node tests/sales-dashboard/runtime.mjs
      - run: npm run build
      - run: npm install --no-save --package-lock=false playwright@1.55.1
      - name: Install and verify headless Chromium
        timeout-minutes: 5
        run: |
          npx playwright install --only-shell chromium
          node --input-type=module -e 'import {chromium} from "playwright";const b=await chromium.launch({headless:true});await b.close();'
      - run: node tests/sales-credit/browser.mjs
