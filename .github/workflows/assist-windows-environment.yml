name: Assist Windows test environment
on:
  pull_request:
    paths:
      - 'tests/assist/windows/**'
      - 'services/assist/**'
      - '.github/workflows/assist-windows-environment.yml'
  workflow_dispatch:
    inputs:
      architecture:
        description: 'Desktop environment to diagnose (ARM64 is currently unsupported)'
        type: choice
        default: x64
        options: [x64, arm64]
permissions:
  contents: read
jobs:
  desktop-environment:
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.architecture == 'arm64' && '["windows-11-arm"]' || '["windows-2022"]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify isolated desktop capture and native input
        shell: pwsh
        run: pwsh -NoProfile -STA -File tests/assist/windows/desktop-preflight.ps1

  windows-guest-connection:
    if: github.event_name != 'workflow_dispatch' || inputs.architecture == 'x64'
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --prefix services/assist
      - run: npm ci --ignore-scripts --prefix tests/assist/windows
      - run: node services/assist/runtime-security.mjs
      - run: npx --prefix tests/assist/windows playwright install chromium
      - name: Verify Windows guest connection, consent, desktop input and revocation
        shell: pwsh
        run: |
          $env:NODE_PATH = (Resolve-Path tests/assist/windows/node_modules).Path
          $env:ASSIST_TEST_OPENSSL = (Get-Command openssl.exe -ErrorAction SilentlyContinue).Source
          if (-not $env:ASSIST_TEST_OPENSSL) {
            $env:ASSIST_TEST_OPENSSL = Join-Path $env:ProgramFiles 'Git/usr/bin/openssl.exe'
          }
          node tests/assist/windows/guest-connection.mjs
