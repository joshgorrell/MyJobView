name: Assist Windows test environment
on:
  pull_request:
    paths:
      - 'tests/assist/windows/**'
      - 'services/assist/**'
      - '.github/workflows/assist-windows-environment.yml'
  workflow_dispatch:
    inputs:
      architecture:
        description: 'Desktop environment to diagnose (ARM64 is currently unsupported)'
        type: choice
        default: x64
        options: [x64, arm64]
permissions:
  contents: read
jobs:
  desktop-environment:
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.architecture == 'arm64' && '["windows-11-arm"]' || '["windows-2022"]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify isolated desktop capture and native input
        shell: pwsh
        run: pwsh -NoProfile -STA -File tests/assist/windows/desktop-preflight.ps1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        if: matrix.runner == 'windows-2022'
        with:
          node-version: '22'
      - name: Prepare pinned runtime and browser
        if: matrix.runner == 'windows-2022'
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm ci --ignore-scripts --prefix services/assist
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm ci --ignore-scripts --prefix tests/assist/windows
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm audit --omit=dev --audit-level=moderate --prefix tests/assist/windows
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node services/assist/runtime-security.mjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npx playwright install chromium
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Verify agent artifacts and test real Windows remote control
        if: matrix.runner == 'windows-2022'
        shell: pwsh
        run: |
          $env:ASSIST_TEST_AGENT_CACHE = Join-Path $env:RUNNER_TEMP 'mjv-verified-agent-cache'
          node services/assist/prepare-agent-cache.mjs $env:ASSIST_TEST_AGENT_CACHE
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $env:NODE_PATH = Join-Path $env:GITHUB_WORKSPACE 'tests/assist/windows/node_modules'
          node tests/assist/windows/real-agent.mjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
