name: Smart Intake contract checks
on:
  pull_request:
    paths:
      - 'supabase/functions/smart-intake-email/**'
      - 'supabase/migrations/*smart_intake*'
      - 'src/lib/smart-intake/**'
      - 'src/components/Dispatch/SmartIntakeHistory.tsx'
      - 'tests/smart-intake/**'
      - '.github/workflows/smart-intake.yml'
  workflow_dispatch:
jobs:
  contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:smart-intake
