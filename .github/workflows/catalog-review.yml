name: Product catalog review
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'supabase/**'
      - 'tests/catalog/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/catalog-review.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: catalog-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Catalog interactions and product dialogs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_SUPABASE_URL: https://security-test.supabase.co
      VITE_SUPABASE_ANON_KEY: test-key
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Production build
        run: npm run build
      - name: Install pinned browser test runtime
        run: npm install --no-save --package-lock=false playwright@1.55.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Catalog filters, history and product dialogs
        run: npm run test:catalog && npm run test:catalog:browser && node tests/catalog/product-dialog-browser.mjs
