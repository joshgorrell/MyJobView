name: Mobile Feedback layout
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/components/Layout/**'
      - 'src/components/Notifications/**'
      - 'src/components/Sales/ReviewsView.tsx'
      - 'src/index.css'
      - 'tailwind.config.js'
      - 'tests/navigation/**'
      - 'tests/reviews/feedback-layout-browser.mjs'
      - '.github/workflows/mobile-feedback-layout.yml'
permissions:
  contents: read
jobs:
  responsive-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm install --no-save --package-lock=false playwright@1.55.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/navigation/responsive-browser.mjs
      - run: node tests/reviews/feedback-layout-browser.mjs
