name: Website widget foundation
on:
  pull_request:
    paths:
      - 'src/lib/websiteWidgets.ts'
      - 'tests/website-widgets/**'
      - '.github/workflows/website-widget-foundation.yml'
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node tests/website-widgets/foundation.mjs
