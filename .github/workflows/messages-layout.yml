name: Messages responsive layout
on:
  pull_request:
    paths:
      - 'src/components/Flow/**'
      - 'tests/flow/**'
      - '.github/workflows/messages-layout.yml'
  workflow_dispatch:
jobs:
  messages-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: node tests/flow/coworker-conversations-browser.mjs
      - run: node tests/flow/customer-conversations-browser.mjs
      - run: node tests/flow/workspace-browser.mjs
