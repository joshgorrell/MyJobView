name: Build and submit fresh iOS TestFlight binary

on:
  workflow_dispatch:
  push:
    branches:
      - fix/ios-auth-branding-oct27
    paths:
      - .github/workflows/eas-build-submit-ios.yml

permissions:
  contents: read

concurrency:
  group: mjv-ios-build5
  cancel-in-progress: false

jobs:
  build-and-submit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact branch commit
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install EAS CLI
        run: npm install --global eas-cli
      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci --no-audit --no-fund
      - name: Verify Expo authorization and build number
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          test -n "$EXPO_TOKEN" || { echo "::error::EXPO_TOKEN GitHub secret is missing"; exit 1; }
          eas whoami
          node -e "const fs=require('fs');const a=require('./app.json');const p=fs.readFileSync('ios/MyJobView.xcodeproj/project.pbxproj','utf8');const nums=[...p.matchAll(/CURRENT_PROJECT_VERSION\\s*=\\s*(\\d+)/g)].map(m=>m[1]);if(a.expo.ios.buildNumber!=='5'||!nums.length||nums.some(n=>n!=='5')){console.error('iOS app.json and native Xcode build numbers must all equal 5',nums);process.exit(1)}"
      - name: Verify native Info.plist does not pin an obsolete build number
        working-directory: mobile
        run: |
          node -e "const fs=require('fs');const p=fs.readFileSync('ios/MyJobView/Info.plist','utf8');if(!/<key>CFBundleVersion<\\/key>\\s*<string>\\$\\(CURRENT_PROJECT_VERSION\\)<\\/string>/.test(p)){console.error('Native Info.plist must use CURRENT_PROJECT_VERSION');process.exit(1)}"
      - name: Build new iOS binary and automatically submit that binary
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas build --platform ios --profile production --non-interactive --auto-submit --wait
