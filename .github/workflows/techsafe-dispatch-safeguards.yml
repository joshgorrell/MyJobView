name: Techsafe dispatch safeguards
on:
  pull_request:
    paths:
      - 'supabase/functions/_shared/techsafe-*.mjs'
      - 'tests/techsafe/**'
      - 'src/lib/techsafe/**'
      - 'supabase/migrations/*techsafe*revision*.sql'
      - 'supabase/migrations/*techsafe*equipment*.sql'
      - 'package.json'
      - '.github/workflows/techsafe-dispatch-safeguards.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify disabled-by-default integration and source comparison
        run: npm run test:techsafe:dispatch && node tests/techsafe/canonical-equipment-evidence.mjs && node tests/techsafe/source-freshness-preflight.mjs && node tests/techsafe/persisted-certificate-gate.mjs && node tests/techsafe/persisted-certificate-row-contract.mjs && node tests/techsafe/order-revision.mjs && node tests/techsafe/private-revision-ledger.mjs && node tests/techsafe/transport-contract.mjs && node tests/techsafe/v2-snapshot-http.mjs && node tests/techsafe/private-delivery-authority.mjs && node tests/techsafe/sales-order-equipment-scope.mjs && node tests/techsafe/equipment-reconciliation.mjs && node tests/techsafe/equipment-transport-projection.mjs && node tests/techsafe/inspected-draft-composition.mjs && node tests/techsafe/draft-content-freshness.mjs && node tests/techsafe/complete-equipment-content-evidence.mjs && node tests/techsafe/verified-source-read.mjs && node tests/techsafe/serializable-equipment-candidate.mjs && node tests/techsafe/locked-equipment-source.mjs && node tests/techsafe/base-equipment-revision-invalidation.mjs
  postgres-revision:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: techsafe_test
          POSTGRES_PASSWORD: test_only_password
          POSTGRES_DB: techsafe_revision_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U techsafe_test -d techsafe_revision_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TECHSAFE_TEST_DATABASE_URL: postgres://techsafe_test:test_only_password@localhost:5432/techsafe_revision_test
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client
      - name: Exercise real PostgreSQL revision invalidation and concurrent writers
        run: bash tests/techsafe/postgres-revision-concurrency.sh
      - name: Verify inert certificate storage on separate disposable PostgreSQL database
        run: |
          PGPASSWORD=test_only_password createdb -h localhost -U techsafe_test techsafe_certificate_test
          TECHSAFE_TEST_DATABASE_URL=postgres://techsafe_test:test_only_password@localhost:5432/techsafe_certificate_test bash tests/techsafe/postgres-certificate-storage.sh
