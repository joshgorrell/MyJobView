name: Techsafe dispatch safeguards
on:
  pull_request:
    paths:
      - 'supabase/functions/_shared/techsafe-*.mjs'
      - 'tests/techsafe/**'
      - 'src/lib/techsafe/**'
      - 'supabase/migrations/*techsafe*revision*.sql'
      - 'package.json'
      - '.github/workflows/techsafe-dispatch-safeguards.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify disabled-by-default integration and source comparison
        run: npm run test:techsafe:dispatch && node tests/techsafe/order-revision.mjs && node tests/techsafe/private-revision-ledger.mjs && node tests/techsafe/transport-contract.mjs && node tests/techsafe/v2-snapshot-http.mjs && node tests/techsafe/private-delivery-authority.mjs && node tests/techsafe/sales-order-equipment-scope.mjs && node tests/techsafe/equipment-reconciliation.mjs
