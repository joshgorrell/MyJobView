name: Security onboarding review
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'supabase/**'
      - 'tests/security-onboarding/**'
      - 'tests/punchlist/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/security-onboarding-review.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: security-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Build and isolated onboarding checks
    # Hosted Ubuntu 24.04 includes Chrome/Chromium's system libraries.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VITE_SUPABASE_URL: https://security-test.supabase.co
      VITE_SUPABASE_ANON_KEY: test-key
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Database, payment access and charge safeguards
        run: npm run test:security-onboarding
      - name: Punchlist ownership and grouped request safeguards
        run: npm run test:punchlist
      - name: Production build
        run: npm run build
      - name: Install pinned browser test runtime
        run: npm install --no-save --package-lock=false playwright@1.55.1
      - name: Install Chromium
        timeout-minutes: 5
        # Avoid re-installing system packages through slow Ubuntu mirrors.
        # Launch once so a missing runtime dependency fails before the suite.
        run: |
          npx playwright install --only-shell chromium
          node --input-type=module -e 'import { chromium } from "playwright"; const browser = await chromium.launch({headless: true}); await browser.close();'
      - name: Mobile resume, signing and printable agreement
        timeout-minutes: 5
        run: node tests/security-onboarding/browser.mjs
