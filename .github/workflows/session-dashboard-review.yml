name: Session dashboard review
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/components/Admin/UserSessions*'
      - 'src/contexts/AuthContext.tsx'
      - 'src/lib/sessionDevices.ts'
      - 'src/lib/userAgentParser.ts'
      - 'supabase/migrations/*browser_session_identity.sql'
      - 'tests/sessions/**'
      - '.github/workflows/session-dashboard-review.yml'
permissions:
  contents: read
jobs:
  session-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:sessions
      - run: npm run typecheck
      - run: npm run build
